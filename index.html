<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Skillup Dashboard" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- DASHBOARD START -->
    <div class="flex w-full">
      <!-- SITE BAR START -->
      <div class="px-8 py-[63px] bg-white w-[280px] h-full shadow-xl">
        <div class="flex flex-col">
          <a class="mb-16" href="#">
            <img
              src="./icon/skillup-icon.svg"
              alt="skillup-icon"
              width="219"
              height="65"
            />
          </a>

          <nav class="mb-[80px]">
            <ul class="flex flex-col gap-2">
              <li>
                <a
                  class="text-lg font-medium flex items-center gap-3 before:content-[url('../icon/home-icon.svg')]"
                  href="#home"
                  >Dashboard</a
                >
              </li>
              <li>
                <a
                  class="text-lg font-medium flex items-center gap-3 before:content-[url('../icon/graduation-icon.svg')] bg-[size:16px] bg-no-repeat"
                  href="#home"
                  >Courses</a
                >
              </li>
              <li>
                <a
                  class="text-lg font-medium flex items-center gap-3 before:content-[url('../icon/calendar-icon.svg')] bg-[size:16px] bg-no-repeat"
                  href="#home"
                  >Lesions</a
                >
              </li>
              <li>
                <a
                  class="text-lg font-medium flex items-center gap-3 before:content-[url('../icon/assessment-icon.svg')] bg-[size:16px] bg-no-repeat"
                  href="#home"
                  >Assessments</a
                >
              </li>
              <li>
                <a
                  class="text-lg font-medium flex items-center gap-3 before:content-[url('../icon/challenge-icon.svg')] bg-[size:16px] bg-no-repeat"
                  href="#home"
                  >Challenges</a
                >
              </li>
              <li>
                <a
                  class="text-lg font-medium flex items-center gap-3 before:content-[url('../icon/folder-icon.svg')] bg-[size:16px] bg-no-repeat"
                  href="#home"
                  >Project</a
                >
              </li>
              <li>
                <a
                  class="text-lg font-medium flex items-center gap-3 before:content-[url('../icon/download-icon.svg')] bg-[size:16px] bg-no-repeat"
                  href="#home"
                  >Download</a
                >
              </li>
            </ul>
          </nav>

          <div
            class="flex flex-col items-center px-5 py-[15px] shadow-2xl rounded-[15px]"
          >
            <img
              src="./icon/lock-icon.svg"
              width="106"
              height="106"
              alt="lock-icon"
            />

            <p class="text-lg font-medium text-center text-[#1C1D1D] mb-5">
              Unlock Premium Resources & Features
            </p>

            <button
              class="py-4 px-5 rounded-2xl bg-[#1C1D1D] text-lg font-medium text-center text-white"
            >
              Upgrade
            </button>
          </div>
        </div>
      </div>
      <!-- SITE BAR END -->
    </div>
    <!-- DASHBOARD END -->
  </body>
</html>
